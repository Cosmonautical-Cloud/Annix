---
namespace: cosmonautical
name: annix
authors:
  - Violet Caulfield
version: 0.2.0
readme: README.md
description: >-
  Templates NixOS configuration files from an Ansible Automation Platform
  inventory and runs nixos-rebuild.
license:
  - GPL-3.0-only
tags:
  - nixos
  - nix
  - homelab
  - infrastructure
repository: https://github.com/Cosmonautical-Cloud/Annix
homepage: https://github.com/Cosmonautical-Cloud/Annix
issues: https://github.com/Cosmonautical-Cloud/Annix/issues
dependencies:
  cosmonautical.nixify: ">=0.1.0"
# Never ship a local inventory (it can hold credentials), the local
# collection cache or the test scenarios.
build_ignore:
  - .ansible
  - molecule
  - inventory/hosts.yml
  - importer_result.json
