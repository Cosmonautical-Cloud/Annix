---
- name: Update flake lock
  become: true
  ansible.builtin.command:
    cmd: nix flake update
    chdir: "{{ annix_nixos_config_dir }}"
  environment:
    # A fresh NixOS install may not have nix-command/flakes enabled yet -
    # don't rely on it already being declared in the running system's config.
    NIX_CONFIG: "experimental-features = nix-command flakes"
  when:
    - annix_flake | bool
    - annix_update_flake_lock | bool
  changed_when: true

- name: Build nixos-rebuild command
  ansible.builtin.set_fact:
    annix_rebuild_cmd: >-
      {{ ['nixos-rebuild', annix_rebuild_action]
         + (['--flake', annix_flake_path] if annix_flake | bool else [])
         + (['--upgrade'] if (not annix_flake | bool and annix_upgrade_channels | bool) else [])
         + annix_rebuild_extra_args }}

- name: Run nixos-rebuild {{ annix_rebuild_action }}
  become: true
  ansible.builtin.command:
    argv: "{{ annix_rebuild_cmd }}"
  environment:
    NIX_CONFIG: "experimental-features = nix-command flakes"
  register: annix_rebuild_result
  changed_when: true
