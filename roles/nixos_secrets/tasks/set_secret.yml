---
- name: Read current value of {{ annix_secret.key }}
  become: true
  ansible.builtin.command:
    argv:
      - sops
      - --decrypt
      - --extract
      - "[\"{{ annix_secret.key }}\"]"
      - --output-type
      - json
      - "{{ annix_secrets_file }}"
  environment:
    SOPS_AGE_KEY_FILE: "{{ annix_secrets_age_key_file }}"
  register: annix_secret_current
  changed_when: false
  failed_when: false
  no_log: true

- name: "Set secret value: {{ annix_secret.key }}"
  become: true
  ansible.builtin.command:
    argv:
      - sops
      - set
      - "{{ annix_secrets_file }}"
      - "[\"{{ annix_secret.key }}\"]"
      - "{{ annix_secret.value | to_json }}"
  environment:
    SOPS_AGE_KEY_FILE: "{{ annix_secrets_age_key_file }}"
  when: >-
    annix_secret_current.rc != 0 or
    (annix_secret_current.stdout | trim) != (annix_secret.value | to_json)
  no_log: true
  changed_when: true
