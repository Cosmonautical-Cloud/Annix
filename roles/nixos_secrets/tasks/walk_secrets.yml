---
# Recurse into nested maps first (e.g. per-player secrets), then set leaves.
# Path is tracked as a dot-joined string rather than a list, since
# ansible-lint's static jinja check can't verify recursive list types.
- name: Recurse into nested secrets
  ansible.builtin.include_tasks: walk_secrets.yml
  loop: "{{ annix_secrets_subtree | dict2items }}"
  loop_control:
    loop_var: annix_secrets_item
    label: "{{ annix_secrets_path }}{{ annix_secrets_item.key }}"
  vars:
    annix_secrets_path: "{{ annix_secrets_path ~ annix_secrets_item.key ~ '.' }}"
    annix_secrets_subtree: "{{ annix_secrets_item.value }}"
  when: annix_secrets_item.value is mapping
  no_log: true

- name: Set leaf secrets at this level
  ansible.builtin.include_tasks: set_secret.yml
  loop: "{{ annix_secrets_subtree | dict2items }}"
  loop_control:
    loop_var: annix_secrets_item
    label: "{{ annix_secrets_path }}{{ annix_secrets_item.key }}"
  vars:
    annix_secret_path: "{{ annix_secrets_path ~ annix_secrets_item.key }}"
    annix_secret_value: "{{ annix_secrets_item.value }}"
  when: annix_secrets_item.value is not mapping
  no_log: true
